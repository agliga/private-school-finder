[project]
name = "school-finder"
version = "0.1.0"
description = "AI private-school finder: agents extract tuition and college outcomes with cited sources; RAG + tool use + evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Gliga" }]
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "fastembed>=0.4",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
school-finder = "school_finder.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
