name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: schools
          POSTGRES_PASSWORD: schools
          POSTGRES_DB: schools
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schools" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schools:schools@localhost:5432/schools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  evals:
    # Runs the evals and fails on regression vs evals/baseline.json.
    # Needs the ANTHROPIC_API_KEY repo secret; skipped (not failed) without it.
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Decide which suites can run
        id: gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Skipping evals: no ANTHROPIC_API_KEY secret"; exit 0
          fi
          echo "translate=true" >> "$GITHUB_OUTPUT"
          if [ -s evals/labels/extraction.jsonl ]; then
            echo "extraction=true" >> "$GITHUB_OUTPUT"
          else
            echo "No extraction labels yet; skipping extraction suite"
          fi
      - if: steps.gate.outputs.translate == 'true'
        run: pip install -e .
      - name: Translation eval (question -> filters)
        if: steps.gate.outputs.translate == 'true'
        run: school-finder eval --suite translate --check
      - name: Extraction eval (frozen pages vs hand labels)
        if: steps.gate.outputs.extraction == 'true'
        run: school-finder eval --suite extraction --check
      - if: always() && steps.gate.outputs.translate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
