name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: schools
          POSTGRES_PASSWORD: schools
          POSTGRES_DB: schools
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schools" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schools:schools@localhost:5432/schools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  evals:
    # Runs the extraction eval on frozen snapshots and fails on regression vs baseline.
    # Needs the ANTHROPIC_API_KEY repo secret; skipped (not failed) without it.
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for API key and labels
        id: gate
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -s evals/labels/extraction.jsonl ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping evals: no ANTHROPIC_API_KEY secret or no labels yet"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: pip install -e .
      - if: steps.gate.outputs.run == 'true'
        run: school-finder eval --suite extraction --check
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
