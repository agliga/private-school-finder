services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: schools
      POSTGRES_PASSWORD: schools
      POSTGRES_DB: schools
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
